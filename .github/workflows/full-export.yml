name: Full Shinylive runtime export
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install R and system dependencies
        run: sudo apt-get update && sudo apt-get install -y r-base libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev libarchive-dev
      - name: Install export tools
        run: sudo Rscript -e 'install.packages(c("shinylive", "shiny", "jsonlite"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest", Ncpus=2); stopifnot(all(vapply(c("shinylive", "shiny", "jsonlite"), requireNamespace, logical(1), quietly=TRUE)))'
      - name: Verify teaching app
        run: Rscript -e 'setwd("app"); source("../tests/test_shiny.R", encoding="UTF-8")'
      - name: Export Shinylive
        run: Rscript build.R
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1200000'
